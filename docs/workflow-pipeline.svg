<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="520" viewBox="0 0 1320 520" role="img" aria-labelledby="title desc">
  <title id="title">Hourly weather forecasting workflow pipeline</title>
  <desc id="desc">End-to-end pipeline from raw weather station files to preprocessing, feature engineering, dataset preparation, XGBoost model training, and a Flask web forecasting application.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6fbfd"/>
      <stop offset="100%" stop-color="#dceaf0"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f80ed"/>
      <stop offset="100%" stop-color="#007c89"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1b2a38" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#31596b"/>
    </marker>
    <style>
      .title { font: 800 28px Arial, sans-serif; fill: #142534; }
      .subtitle { font: 500 14px Arial, sans-serif; fill: #526879; }
      .card { fill: rgba(255,255,255,0.92); stroke: rgba(21,54,68,0.18); stroke-width: 1.4; filter: url(#shadow); }
      .head { font: 800 15px Arial, sans-serif; fill: #142534; }
      .body { font: 500 12px Arial, sans-serif; fill: #3e5260; }
      .small { font: 500 11px Arial, sans-serif; fill: #617484; }
      .badgeText { font: 800 13px Arial, sans-serif; fill: white; }
      .icon { font: 700 27px Arial, sans-serif; fill: #007c89; }
      .footerCard { fill: rgba(255,255,255,0.78); stroke: rgba(21,54,68,0.18); stroke-dasharray: 6 5; }
      .footerTitle { font: 800 12px Arial, sans-serif; fill: #142534; }
      .footerBody { font: 500 11px Arial, sans-serif; fill: #405562; }
    </style>
  </defs>

  <rect width="1320" height="520" rx="26" fill="url(#bg)"/>
  <circle cx="132" cy="58" r="90" fill="#007c89" opacity="0.08"/>
  <circle cx="1132" cy="80" r="120" fill="#e7a21a" opacity="0.09"/>
  <circle cx="680" cy="480" r="160" fill="#2f80ed" opacity="0.07"/>

  <text x="660" y="42" text-anchor="middle" class="title">Hourly Weather Forecasting - Full Workflow Pipeline</text>
  <text x="660" y="66" text-anchor="middle" class="subtitle">From raw weather station observations to a 24-hour forecast dashboard</text>

  <!-- Cards -->
  <g transform="translate(30 102)">
    <rect class="card" width="185" height="245" rx="18"/>
    <circle cx="23" cy="24" r="15" fill="#2f80ed"/>
    <text x="23" y="29" text-anchor="middle" class="badgeText">1</text>
    <text x="48" y="29" class="head">Raw Data</text>
    <text x="48" y="47" class="head">Acquisition</text>
    <text x="92" y="93" text-anchor="middle" class="icon">TOA5</text>
    <text x="92" y="119" text-anchor="middle" class="body">Weather station files</text>
    <text x="92" y="139" text-anchor="middle" class="small">2015-2020 hourly observations</text>
    <rect x="26" y="168" width="133" height="48" rx="12" fill="#f2f7fa" stroke="#cbdce5"/>
    <text x="92" y="188" text-anchor="middle" class="body">At least 24-48h</text>
    <text x="92" y="205" text-anchor="middle" class="small">recent observations</text>
  </g>

  <g transform="translate(245 102)">
    <rect class="card" width="185" height="245" rx="18"/>
    <circle cx="23" cy="24" r="15" fill="#43a047"/>
    <text x="23" y="29" text-anchor="middle" class="badgeText">2</text>
    <text x="48" y="29" class="head">Preprocessing</text>
    <text x="48" y="47" class="head">and Cleaning</text>
    <text x="30" y="86" class="body">✓ Timestamp parsing</text>
    <text x="30" y="111" class="body">✓ Metadata removal</text>
    <text x="30" y="136" class="body">✓ Duplicate handling</text>
    <text x="30" y="161" class="body">✓ Missing value checks</text>
    <text x="30" y="186" class="body">✓ Chronological sorting</text>
    <rect x="30" y="207" width="125" height="23" rx="10" fill="#eaf6ed"/>
    <text x="92" y="223" text-anchor="middle" class="small">Clean validated data</text>
  </g>

  <g transform="translate(460 102)">
    <rect class="card" width="185" height="245" rx="18"/>
    <circle cx="23" cy="24" r="15" fill="#e7a21a"/>
    <text x="23" y="29" text-anchor="middle" class="badgeText">3</text>
    <text x="48" y="29" class="head">Feature</text>
    <text x="48" y="47" class="head">Engineering</text>
    <text x="30" y="85" class="body">Time features</text>
    <text x="30" y="104" class="small">hour, month, day, seasonality</text>
    <text x="30" y="135" class="body">Cyclical encoding</text>
    <text x="30" y="154" class="small">sin/cos transformations</text>
    <text x="30" y="185" class="body">Lag and rolling features</text>
    <text x="30" y="204" class="small">1h, 3h, 6h, 12h, 24h</text>
    <rect x="30" y="218" width="125" height="20" rx="10" fill="#fff6dc"/>
    <text x="92" y="232" text-anchor="middle" class="small">Model-ready row</text>
  </g>

  <g transform="translate(675 102)">
    <rect class="card" width="185" height="245" rx="18"/>
    <circle cx="23" cy="24" r="15" fill="#7e57c2"/>
    <text x="23" y="29" text-anchor="middle" class="badgeText">4</text>
    <text x="48" y="29" class="head">Dataset</text>
    <text x="48" y="47" class="head">Preparation</text>
    <rect x="33" y="77" width="119" height="50" rx="12" fill="#f4eefb" stroke="#d7c7eb"/>
    <text x="92" y="98" text-anchor="middle" class="body">Define targets</text>
    <text x="92" y="116" text-anchor="middle" class="small">t+1 ... t+24</text>
    <rect x="33" y="145" width="119" height="60" rx="12" fill="#f4eefb" stroke="#d7c7eb"/>
    <text x="92" y="167" text-anchor="middle" class="body">Multi-output</text>
    <text x="92" y="185" text-anchor="middle" class="small">24 future hours</text>
    <text x="92" y="226" text-anchor="middle" class="small">Chronological split</text>
  </g>

  <g transform="translate(890 102)">
    <rect class="card" width="185" height="245" rx="18"/>
    <circle cx="23" cy="24" r="15" fill="#007c89"/>
    <text x="23" y="29" text-anchor="middle" class="badgeText">5</text>
    <text x="48" y="29" class="head">Model Training</text>
    <text x="48" y="47" class="head">XGBoost</text>
    <text x="92" y="91" text-anchor="middle" class="icon">XGB</text>
    <text x="92" y="120" text-anchor="middle" class="body">Gradient boosted trees</text>
    <path d="M42 170 C65 145, 80 190, 103 160 S136 135, 150 178" fill="none" stroke="#007c89" stroke-width="4" stroke-linecap="round"/>
    <text x="92" y="218" text-anchor="middle" class="small">Predict 24 hours at once</text>
  </g>

  <g transform="translate(1105 102)">
    <rect class="card" width="185" height="245" rx="18"/>
    <circle cx="23" cy="24" r="15" fill="#ef7d35"/>
    <text x="23" y="29" text-anchor="middle" class="badgeText">6</text>
    <text x="48" y="29" class="head">Forecast App</text>
    <text x="48" y="47" class="head">Flask Dashboard</text>
    <rect x="40" y="78" width="105" height="70" rx="10" fill="#f2f7fa" stroke="#b9ccd6"/>
    <path d="M55 126 L75 111 L96 119 L128 93" fill="none" stroke="#007c89" stroke-width="4" stroke-linecap="round"/>
    <text x="34" y="184" class="body">• 24-hour curve</text>
    <text x="34" y="207" class="body">• Summary metrics</text>
    <text x="34" y="230" class="body">• CSV export</text>
  </g>

  <!-- Arrows -->
  <line x1="218" y1="224" x2="238" y2="224" stroke="#31596b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="433" y1="224" x2="453" y2="224" stroke="#31596b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="648" y1="224" x2="668" y2="224" stroke="#31596b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="863" y1="224" x2="883" y2="224" stroke="#31596b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1078" y1="224" x2="1098" y2="224" stroke="#31596b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Feedback latest observation -->
  <path d="M1188 358 C1060 405, 725 408, 551 360" fill="none" stroke="#31596b" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)" opacity="0.75"/>
  <rect x="496" y="345" width="220" height="40" rx="14" fill="#eff8fb" stroke="#bdd5df"/>
  <text x="606" y="362" text-anchor="middle" class="body">Latest observation</text>
  <text x="606" y="378" text-anchor="middle" class="small">used to generate the next 24 hours</text>

  <!-- Footer -->
  <g transform="translate(30 405)">
    <rect class="footerCard" width="1260" height="82" rx="18"/>
    <line x1="252" y1="0" x2="252" y2="82" stroke="#c4d5dd" stroke-dasharray="5 5"/>
    <line x1="504" y1="0" x2="504" y2="82" stroke="#c4d5dd" stroke-dasharray="5 5"/>
    <line x1="756" y1="0" x2="756" y2="82" stroke="#c4d5dd" stroke-dasharray="5 5"/>
    <line x1="1008" y1="0" x2="1008" y2="82" stroke="#c4d5dd" stroke-dasharray="5 5"/>

    <text x="28" y="25" class="footerTitle">Minimum data requirement</text>
    <text x="28" y="47" class="footerBody">At least 24 recent hourly records</text>
    <text x="28" y="64" class="footerBody">48+ hours recommended for robustness</text>

    <text x="280" y="25" class="footerTitle">Key engineered features</text>
    <text x="280" y="47" class="footerBody">Lag, rolling, cyclical, calendar features</text>
    <text x="280" y="64" class="footerBody">plus meteorological variables</text>

    <text x="532" y="25" class="footerTitle">Forecast horizon</text>
    <text x="532" y="47" class="footerBody">24 simultaneous hourly predictions</text>
    <text x="532" y="64" class="footerBody">multi-output regression</text>

    <text x="784" y="25" class="footerTitle">Technology stack</text>
    <text x="784" y="47" class="footerBody">Python, Pandas, NumPy, XGBoost</text>
    <text x="784" y="64" class="footerBody">Flask, HTML, CSS, JavaScript</text>

    <text x="1036" y="25" class="footerTitle">Deployment target</text>
    <text x="1036" y="47" class="footerBody">Local Flask dashboard</text>
    <text x="1036" y="64" class="footerBody">ready for future API/live station integration</text>
  </g>
</svg>
